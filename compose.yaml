version: '3.8'

services:

  # --- MONGODB SHARDED CLUSTER ---
  mongos:
    image: mongo:latest
    container_name: mongos
    command: mongos --configdb configRS/configsvr:27019 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    depends_on:
      - configsvr
      - shard1-a
      - shard1-b
      - shard1-c
      - shard2
      - shard3
    networks:
      - mongo-cluster
    deploy:
      resources:
        limits:
          memory: 512M

  configsvr:
    image: mongo:latest
    container_name: configsvr
    command: mongod --configsvr --replSet configRS --bind_ip_all --port 27019
    networks:
      - mongo-cluster
    deploy:
      resources:
        limits:
          memory: 512M

  shard1-a:
    image: mongo:latest
    container_name: shard1-a
    command: mongod --shardsvr --replSet shard1RS --bind_ip_all --port 27018
    networks:
      - mongo-cluster
    deploy:
      resources:
        limits:
          memory: 1G

  shard1-b:
    image: mongo:latest
    container_name: shard1-b
    command: mongod --shardsvr --replSet shard1RS --bind_ip_all --port 27020
    networks:
      - mongo-cluster
    deploy:
      resources:
        limits:
          memory: 1G

  shard1-c:
    image: mongo:latest
    container_name: shard1-c
    command: mongod --shardsvr --replSet shard1RS --bind_ip_all --port 27021
    networks:
      - mongo-cluster
    deploy:
      resources:
        limits:
          memory: 1G

  shard2:
    image: mongo:latest
    container_name: shard2
    command: mongod --shardsvr --replSet shard2RS --bind_ip_all --port 27022
    networks:
      - mongo-cluster
    deploy:
      resources:
        limits:
          memory: 1G

  shard3:
    image: mongo:latest
    container_name: shard3
    command: mongod --shardsvr --replSet shard3RS --bind_ip_all --port 27023
    networks:
      - mongo-cluster
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  mongo-cluster:
    driver: bridge
